name: DA005 private VMware JSONL file writer
# No network I/O or attack generation: mocked underlying CLI.
on:
  push:
    paths:
      - 'scripts/run_vmware_progress_file.py'
      - 'tests/test_vmware_progress_file.py'
      - '.github/workflows/vmware-jsonl-writer.yml'
  pull_request:
    paths:
      - 'scripts/run_vmware_progress_file.py'
      - 'tests/test_vmware_progress_file.py'
      - '.github/workflows/vmware-jsonl-writer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - name: Install offline app and test dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Network-free tests of exclusive local JSONL writer
        run: python -m pytest -q tests/test_vmware_progress_file.py
