name: Fetch CTU-13 Scenario 7 dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Assert Python 3.12.9
        run: python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 9)"
      - name: Download and validate original dataset
        run: python scripts/download_ctu13.py
      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ctu13_scenario_07/
          if ! git diff --cached --quiet; then
            git commit -m "data: add original CTU-13 scenario 7 labeled network flows"
            git push origin HEAD:main
          fi
