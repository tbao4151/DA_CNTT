name: Fetch UNSW-NB15 and validate

on:
  push:
    paths:
      - ".github/workflows/fetch-unsw-nb15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and validate UNSW-NB15
        run: python3 scripts/download_unsw_nb15.py
      - name: Commit validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/unsw_nb15/
          if ! git diff --cached --quiet; then
            git commit -m "data: add verified UNSW-NB15 train and test sets"
            git push origin HEAD:main
          fi
