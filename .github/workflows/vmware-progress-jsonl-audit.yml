name: DA005 SHA-pinned VMware JSONL audit (offline)
# Cancel obsolete checks on feature branches/PRs; preserve main and manual audits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
# Tests only private local JSONL built with Python dry-run/mocked SSH.
# Never connects to VMware or generates network traffic.
on:
  push:
    paths:
      - 'scripts/verify_vmware_progress_jsonl.py'
      - 'tests/test_vmware_progress_jsonl_audit.py'
      - 'tests/emit_vmware_jsonl_browser_cases.py'
      - '.github/workflows/vmware-progress-jsonl-audit.yml'
  pull_request:
    paths:
      - 'scripts/verify_vmware_progress_jsonl.py'
      - 'tests/test_vmware_progress_jsonl_audit.py'
      - 'tests/emit_vmware_jsonl_browser_cases.py'
      - '.github/workflows/vmware-progress-jsonl-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install app and test dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Pinned private JSONL audit with zero network
        run: python -m pytest -q tests/test_vmware_progress_jsonl_audit.py tests/test_vmware_progress_file.py tests/test_vmware_stage_progress.py
