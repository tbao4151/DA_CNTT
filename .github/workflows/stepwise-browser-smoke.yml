name: DA005 Step-by-Step browser smoke
# Real browser + mocked API, never proof of VMware, live attack or AI detection.
on:
  push:
    paths:
      - 'frontend/scripts/stepwise-browser-smoke.mjs'
      - '.github/workflows/stepwise-browser-smoke.yml'
      - 'frontend/src/app/automated-lab/**'
  pull_request:
    paths:
      - 'frontend/scripts/stepwise-browser-smoke.mjs'
      - '.github/workflows/stepwise-browser-smoke.yml'
      - 'frontend/src/app/automated-lab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Chromium Step-by-Step smoke with mocked synthetic API
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/da005-nextjs-browser-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/stepwise-browser-smoke.mjs
