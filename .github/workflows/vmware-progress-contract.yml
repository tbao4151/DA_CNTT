name: DA005 VMware phase progress contract (offline)
# No VMware, SSH, network stimulus or AI inference in CI; mocks only.
on:
  push:
    paths:
      - "scripts/run_vmware_stepwise.py"
      - "tests/test_vmware_stage_progress.py"
      - ".github/workflows/vmware-progress-contract.yml"
  pull_request:
    paths:
      - "scripts/run_vmware_stepwise.py"
      - "tests/test_vmware_stage_progress.py"
      - ".github/workflows/vmware-progress-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vmware-progress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install offline Python dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Check real-stage schema using network-free mocks
        run: python -m pytest -q tests/test_vmware_stage_progress.py tests/test_vmware_stepwise.py
