name: DA005 VMware Local JSONL viewer browser QA
# Strict browser/format tests only; no VMware or network probes.
on:
  push:
    paths:
      - 'frontend/src/app/vmware-progress/**'
      - 'frontend/src/lib/vmwareProgress.ts'
      - 'frontend/scripts/vmware-progress-browser-smoke.mjs'
      - '.github/workflows/vmware-viewer-browser.yml'
  pull_request:
    paths:
      - 'frontend/src/app/vmware-progress/**'
      - 'frontend/src/lib/vmwareProgress.ts'
      - 'frontend/scripts/vmware-progress-browser-smoke.mjs'
      - '.github/workflows/vmware-viewer-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Read-only Chromium import of JSONL and provenance checks
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/da005-vmware-progress.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/vmware-progress-browser-smoke.mjs
