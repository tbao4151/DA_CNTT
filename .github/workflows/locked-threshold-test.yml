name: Locked validation threshold - official held-out test

# Execute when introduced on main, or manually. No threshold tuning on test.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/locked-threshold-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: da005-locked-official-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: "pip"
          cache-dependency-path: requirements-app.txt
      - name: Assert Python 3.12.9
        run: python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 9)"
      - name: Install dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Verify dataset checksums
        run: python scripts/download_unsw_nb15.py
      - name: Fit full-training model and record default baseline
        run: python scripts/train_siem.py
      - name: Evaluate previously selected validation threshold on official test once
        run: python scripts/evaluate_locked_threshold.py
      - name: Check test report consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selection = json.loads(Path("reports/validation_threshold_experiment.json").read_text(encoding="utf-8"))
          original = json.loads(Path("artifacts/metrics.json").read_text(encoding="utf-8"))
          report = json.loads(Path("artifacts/locked_threshold_official_test.json").read_text(encoding="utf-8"))
          assert report["dataset_split"] == "UNSW-NB15 official testing partition"
          assert report["test_rows"] == 82332
          assert report["candidate_threshold"] == selection["threshold"] == 0.55
          assert report["validation_selection_run_id"] == selection["source_run_id"] == 40366465257
          # Ensure 0.50 comparison agrees with the baseline emitted by the SAME fitted model.
          cm = original["confusion_matrix_0_1"]
          assert report["baseline"]["true_negative"] == cm[0][0]
          assert report["baseline"]["false_positive"] == cm[0][1]
          assert report["baseline"]["false_negative"] == cm[1][0]
          assert report["baseline"]["true_positive"] == cm[1][1]
          for group in ("baseline", "candidate"):
              m = report[group]
              assert sum(m[k] for k in ("true_positive", "false_positive", "true_negative", "false_negative")) == 82332
              assert 0 <= m["precision_attack"] <= 1
              assert 0 <= m["recall_attack"] <= 1
              assert 0 <= m["f1_attack"] <= 1
          print("One locked validation candidate evaluated; no threshold search on official test.")
          PY
      - name: Upload held-out test comparison, no repository mutation
        uses: actions/upload-artifact@v4
        with:
          name: da005-locked-threshold-official-test
          path: artifacts/locked_threshold_official_test.json
          if-no-files-found: error
          retention-days: 14
