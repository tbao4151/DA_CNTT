name: Real Zeek offline synthetic smoke
# The second acceptance stage exercises the production offline importer via real Zeek.

on:
  pull_request:
    paths:
      - ".github/workflows/real-zeek-offline-smoke.yml"
      - "src/blue_team_ai/zeek_smoke.py"
      - "src/blue_team_ai/offline_pcap.py"
      - "src/blue_team_ai/zeek_reprocessing_compare.py"
      - "src/blue_team_ai/pcap_zeek_tuple.py"
      - "scripts/replay_zeek_twice_offline.py"
      - "src/blue_team_ai/zeek.py"
      - "src/blue_team_ai/features.py"
      - "src/blue_team_ai/lab_scope.py"
      - "src/blue_team_ai/telemetry_quality.py"
      - "scripts/inspect_zeek_telemetry_quality.py"
      - "tests/test_zeek_telemetry_quality.py"
      - "tests/test_zeek_declared_types.py"
      - "tests/test_zeek_lab_cli.py"
      - "tests/test_zeek_real_smoke.py"
      - "tests/ci_real_zeek_scoring.py"
      - "tests/test_ci_real_zeek_scoring.py"
      - "tests/test_ci_real_zeek_soc_contract.py"
      - "scripts/triage_zeek_new_log.py"
      - "src/blue_team_ai/new_log_triage.py"
      - "src/siem_ai/case_report.py"
      - "src/blue_team_ai/new_log_inference.py"
      - "src/blue_team_ai/model_artifact.py"
      - "src/blue_team_ai/new_log_review.py"
      - "scripts/score_zeek_new_log.py"
      - "scripts/verify_zeek_new_log_report.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-zeek-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure temporary evidence directory
        run: echo "SMOKE_DIR=$RUNNER_TEMP/da005-real-zeek-smoke" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install research scoring dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Generate deterministic benign PCAP (no sockets)
        run: |
          mkdir -p "$SMOKE_DIR"
          PYTHONPATH=src python - <<'PY'
          import os
          from pathlib import Path
          from blue_team_ai.zeek_smoke import build_benign_udp_pcap
          target = Path(os.environ["SMOKE_DIR"]) / "benign_synthetic.pcap"
          with target.open("xb") as stream:
              stream.write(build_benign_udp_pcap())
          print("Synthetic offline PCAP generated; no capture or attack.")
          PY
      - name: Run actual Zeek binary on offline fixture in network-disabled container
        run: |
          docker pull zeek/zeek:9.0.1
          docker image inspect zeek/zeek:9.0.1 --format '{{.Id}}'
          docker run --rm \
            --network none \
            --read-only \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=16m \
            --mount "type=bind,src=$SMOKE_DIR,dst=/work" \
            --workdir /work \
            zeek/zeek:9.0.1 \
            /bin/sh -c 'zeek --version > /work/zeek_version.txt 2>&1 && zeek -r /work/benign_synthetic.pcap'
      - name: Validate genuine Zeek output against exact fixture contract
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from blue_team_ai.lab_scope import inspect_zeek_lab_scope
          from blue_team_ai.zeek_smoke import build_benign_udp_pcap, verify_fixture_feature_projection

          root = Path(os.environ["SMOKE_DIR"])
          pcap = root / "benign_synthetic.pcap"
          conn = root / "conn.log"
          assert pcap.read_bytes() == build_benign_udp_pcap()
          feature_contract = verify_fixture_feature_projection(conn)
          scope = inspect_zeek_lab_scope(conn.read_bytes(), ["192.168.56.0/24"])
          assert scope["flow_count"] == 1
          version = (root / "zeek_version.txt").read_text(encoding="utf-8").strip()
          assert version.startswith("zeek version ")
          result = {
              "report_version": 1,
              "source_kind": "synthetic_benign_udp_fixture",
              "execution": "github_actions_real_zeek_offline_container",
              "zeek_image_tag": "zeek/zeek:9.0.1",
              "zeek_version_reported": version,
              "pcap_sha256": hashlib.sha256(pcap.read_bytes()).hexdigest(),
              "zeek_conn_sha256": hashlib.sha256(conn.read_bytes()).hexdigest(),
              "flow_count": scope["flow_count"],
              "fixture_flow_identity_verified": True,
              "fixture_event_time_verified": True,
              **feature_contract,
              "zeek_container_network_disabled": True,
              "vmware_capture_performed": False,
              "host_only_isolation_verified": False,
              "attack_ground_truth_verified": False,
              "ai_scoring_performed": False,
              "soc_case_created": False,
              "interpretation": "Actual Zeek decoded a synthetic benign PCAP in CI; not a VMware capture, attack detection, or Windows acceptance.",
          }
          (root / "ci_smoke_report.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY
      - name: Exercise production offline importer with actual network-disabled Zeek
        run: |
          # The host Python CLI remains unchanged. Only the Zeek executable
          # is proxied into the pinned, network-disabled Docker image.
          # No capture interface or live traffic is used.
          mkdir -p "$SMOKE_DIR/bin"
          cat > "$SMOKE_DIR/bin/zeek" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -ne 2 || "$1" != "-r" || ! -f "$2" ]]; then
            echo "CI Zeek proxy only permits -r with an existing PCAP" >&2
            exit 2
          fi
          exec docker run --rm \
            --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=16m \
            --mount "type=bind,src=$2,dst=/input.pcap,readonly" \
            --mount "type=bind,src=$PWD,dst=/work" \
            --workdir /work \
            zeek/zeek:9.0.1 \
            /bin/sh -c 'zeek -r /input.pcap'
          SH
          chmod +x "$SMOKE_DIR/bin/zeek"
          export PATH="$SMOKE_DIR/bin:$PATH"
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from blue_team_ai.offline_pcap import import_offline_pcap
          from blue_team_ai.offline_pcap_verify import verify_offline_pcap_import
          from blue_team_ai.zeek_smoke import verify_fixture_feature_projection

          root = Path(os.environ["SMOKE_DIR"])
          pcap = root / "benign_synthetic.pcap"
          output = root / "importer-real"
          imported = import_offline_pcap(
              pcap, output, lab_cidrs=["192.168.56.0/24"],
              operator_confirmed_offline=True,
          )
          report = output / "offline_import_report.json"
          digest = hashlib.sha256(report.read_bytes()).hexdigest()
          verified = verify_offline_pcap_import(
              report, expected_report_sha256=digest,
              pcap_path=pcap, log_path=output / "conn.log",
              lab_cidrs=["192.168.56.0/24"],
          )
          projection = verify_fixture_feature_projection(output / "conn.log")
          assert imported["flow_count"] == verified["flow_count"] == 1
          assert imported["zeek_conn_sha256"] == verified["zeek_conn_sha256"]
          assert imported["ai_inference_performed"] is False
          result = {
              "source_kind": "synthetic_benign_udp_fixture",
              "execution": "real_zeek_offline_importer_via_network_disabled_container",
              "import_report_sha256": digest,
              "zeek_conn_sha256": imported["zeek_conn_sha256"],
              "flow_count": imported["flow_count"],
              "importer_and_independent_verifier_succeeded": True,
              **projection,
              "vmware_capture_performed": False,
              "attack_ground_truth_verified": False,
              "ai_scoring_performed": False,
              "soc_case_created": False,
              "interpretation": "Synthetic offline importer acceptance in CI only; not a real lab capture or attack detection.",
          }
          (root / "ci_importer_real_report.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY
      - name: Exercise production two-pass runner with actual offline Zeek (synthetic only)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["SMOKE_DIR"])
          pcap = root / "benign_synthetic.pcap"
          wrapper = (root / "bin" / "zeek").resolve(strict=True)
          wrapper_pin = hashlib.sha256(wrapper.read_bytes()).hexdigest()
          pcap_pin = hashlib.sha256(pcap.read_bytes()).hexdigest()
          first = root / "two-pass-real-1"
          second = root / "two-pass-real-2"
          assert not first.exists() and not second.exists()
          cmd = [
              sys.executable, "scripts/replay_zeek_twice_offline.py",
              "--pcap", str(pcap),
              "--expected-pcap-sha256", pcap_pin,
              "--first-output-dir", str(first),
              "--second-output-dir", str(second),
              "--cidr", "192.168.56.0/24",
              "--confirm-offline-only",
              "--expected-zeek-binary-sha256", wrapper_pin,
          ]
          env = os.environ.copy()
          env["PATH"] = str(wrapper.parent) + os.pathsep + env["PATH"]
          bad = cmd.copy()
          bad[bad.index("--expected-zeek-binary-sha256") + 1] = "0" * 64
          rejected = subprocess.run(
              bad, capture_output=True, text=True, env=env, timeout=30, check=False,
          )
          assert rejected.returncode == 2, rejected.stderr
          assert not rejected.stdout
          assert not first.exists() and not second.exists()
          accepted = subprocess.run(
              cmd, capture_output=True, text=True, env=env, timeout=360, check=False,
          )
          assert accepted.returncode == 0, accepted.stderr
          summary = json.loads(accepted.stdout)
          assert summary["pcap_sha256"] == pcap_pin
          assert summary["two_zeek_subprocesses_completed"] is True
          assert summary["strict_all_non_uid_fields_equivalent"] is True
          assert summary["pcap_tuple_presence_for_both_logs"] is True
          assert summary["zeek_binary_sha256_pinned"] is True
          assert summary["zeek_binary_sha256"] == wrapper_pin
          assert summary["zeek_binary_version_verified"] is False
          assert summary["pcap_to_log_derivation_proven"] is False
          assert summary["host_only_isolation_verified"] is False
          assert summary["capture_authenticity_verified"] is False
          assert summary["independent_labels_verified"] is False
          assert summary["attack_detection_verified"] is False
          assert summary["zeek_flow_count"] == 1
          assert summary["pcap_packet_count"] >= summary["zeek_flow_count"] >= 1
          for directory, key in (
              (first, "first_zeek_conn_sha256"),
              (second, "second_zeek_conn_sha256"),
          ):
              log = directory / "conn.log"
              assert hashlib.sha256(log.read_bytes()).hexdigest() == summary[key]
              assert (directory / "offline_import_report.json").is_file()
          assert hashlib.sha256(pcap.read_bytes()).hexdigest() == pcap_pin
          summary.update({
              "ci_source_kind": "deterministic_synthetic_benign_udp_pcap",
              "ci_execution": "two_real_zeek_r_passes_via_network_disabled_docker_proxy",
              "ci_zeek_image_tag": "zeek/zeek:9.0.1",
              "ci_sha256_pin_scope": "host_side_proxy_script_only_not_container_zeek_binary",
              "ci_vmware_capture_performed": False,
              "ci_independent_attack_labels": False,
              "ci_soc_case_created": False,
          })
          (root / "ci_two_pass_real_zeek_report.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Two real offline Zeek passes on synthetic PCAP succeeded; no VMware/attack claim.")
          PY
      - name: Check production telemetry quality CLI against real Zeek output (synthetic only)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["SMOKE_DIR"])
          source = root / "importer-real" / "conn.log"
          original = source.read_bytes()
          digest = hashlib.sha256(original).hexdigest()
          output = root / "ci_real_zeek_telemetry_quality.json"
          cli = Path("scripts/inspect_zeek_telemetry_quality.py")

          def run_quality(pin, cidr, destination):
              return subprocess.run(
                  [
                      sys.executable, str(cli), "--log", str(source),
                      "--expected-log-sha256", pin,
                      "--cidr", cidr, "--output", str(destination),
                       "--require-zeek-types",
                  ],
                  capture_output=True, text=True, check=False,
              )

          accepted = run_quality(digest, "192.168.56.0/24", output)
          assert accepted.returncode == 0, accepted.stderr
          quality = json.loads(output.read_text(encoding="utf-8"))
          assert quality["mode"] == "offline_zeek_telemetry_quality_only"
          assert quality["source_sha256"] == digest
          assert quality["flow_count"] == 1
          assert quality["feature_schema_version"] == 1
          assert quality["zeek_declared_types"]["declared_types_checked"] is True
          assert quality["zeek_declared_types"]["required_type_fields_checked"] == 7
          assert quality["protocol_bucket_counts"]["udp"] == 1
          assert sum(quality["protocol_bucket_counts"].values()) == 1
          assert "fewer_than_30_flows" in quality["warnings"]
          for key in (
              "host_only_isolation_verified", "capture_authenticity_verified",
              "independent_ground_truth_verified", "model_fitted",
              "attack_detection_performed", "operational_alerts", "live_capture",
          ):
              assert quality[key] is False
          serialized = json.dumps(quality)
          assert "192.168.56." not in serialized

          bad_pin = root / "rejected_wrong_hash_quality.json"
          assert run_quality("0" * 64, "192.168.56.0/24", bad_pin).returncode != 0
          assert not bad_pin.exists()
          bad_scope = root / "rejected_wrong_scope_quality.json"
          assert run_quality(digest, "10.0.0.0/24", bad_scope).returncode != 0
          assert not bad_scope.exists()
          assert run_quality(digest, "192.168.56.0/24", output).returncode != 0
          assert source.read_bytes() == original
          print("Real-Zeek synthetic quality CLI: accepted, fail-closed gates and no overwrite verified.")
          PY
      - name: Exercise production scoring, review and explicit manual SOC triage (synthetic-only)
        run: PYTHONPATH=src:tests python tests/ci_real_zeek_scoring.py --root "$SMOKE_DIR"
      - name: Upload synthetic-only reproducibility evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: da005-real-zeek-synthetic-smoke
          path: |
            ${{ env.SMOKE_DIR }}/benign_synthetic.pcap
            ${{ env.SMOKE_DIR }}/conn.log
            ${{ env.SMOKE_DIR }}/zeek_version.txt
            ${{ env.SMOKE_DIR }}/ci_smoke_report.json
            ${{ env.SMOKE_DIR }}/ci_importer_real_report.json
            ${{ env.SMOKE_DIR }}/ci_two_pass_real_zeek_report.json
            ${{ env.SMOKE_DIR }}/two-pass-real-1/conn.log
            ${{ env.SMOKE_DIR }}/two-pass-real-1/offline_import_report.json
            ${{ env.SMOKE_DIR }}/two-pass-real-2/conn.log
            ${{ env.SMOKE_DIR }}/two-pass-real-2/offline_import_report.json
            ${{ env.SMOKE_DIR }}/ci_real_zeek_telemetry_quality.json
            ${{ env.SMOKE_DIR }}/ci_real_zeek_scoring_report.json
            ${{ env.SMOKE_DIR }}/importer-real/conn.log
            ${{ env.SMOKE_DIR }}/importer-real/offline_import_report.json
          if-no-files-found: error
          retention-days: 7
