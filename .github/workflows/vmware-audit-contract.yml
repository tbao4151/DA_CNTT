name: DA005 VMware snapshot evidence audit (offline)
# Byte-consistency regression only: no VMware, SSH, model inference, traffic or SOC.
on:
  push:
    paths:
      - "scripts/verify_vmware_snapshot_bundle.py"
      - "tests/test_vmware_snapshot_bundle_audit.py"
      - ".github/workflows/vmware-audit-contract.yml"
  pull_request:
    paths:
      - "scripts/verify_vmware_snapshot_bundle.py"
      - "tests/test_vmware_snapshot_bundle_audit.py"
      - ".github/workflows/vmware-audit-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install minimal test runner
        run: python -m pip install pytest
      - name: Evidence audit contract tests (synthetic, no network)
        run: python -m pytest -q tests/test_vmware_snapshot_bundle_audit.py
