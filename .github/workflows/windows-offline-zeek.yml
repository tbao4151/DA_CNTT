name: Windows offline Zeek contract
# Cross-platform software regression only. No Zeek binary, network capture or VMware.
on:
  pull_request:
    paths:
      - ".github/workflows/windows-offline-zeek.yml"
      - "src/blue_team_ai/**"
      - "src/siem_ai/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Assert exact Windows Python version
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform()); assert sys.version_info[:3] == (3, 12, 9)"
      - name: Install offline application and test dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Check Python syntax
        run: python -m compileall -q src scripts
      - name: Offline Zeek import, provenance, scoring, SOC and held-out contracts
        run: python -m pytest -q tests/test_zeek_lab_cli.py tests/test_zeek_telemetry_quality.py tests/test_offline_pcap_import.py tests/test_offline_pcap_scoring_gate.py tests/test_offline_pcap_soc_triage_gate.py tests/test_zeek_new_log_inference.py tests/test_zeek_manual_triage.py
