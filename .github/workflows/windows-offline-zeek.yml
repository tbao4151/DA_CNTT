name: Windows offline Zeek contract
# Cross-platform software regression only. No Zeek binary, network capture or VMware.
on:
  pull_request:
    paths:
      - ".github/workflows/windows-offline-zeek.yml"
      - "src/blue_team_ai/**"
      - "src/red_team_ai/**"
      - "src/shared/**"
      - "pages/2_Red_Team_Lab.py"
      - "pages/3_New_Log_Review.py"
      - "src/siem_ai/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Assert exact Windows Python version
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform()); assert sys.version_info[:3] == (3, 12, 9)"
      - name: Install offline application and test dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Check Python syntax
        run: python -m compileall -q src scripts pages/3_New_Log_Review.py
      - name: Current Sentinel Lab status inventory (static contract only)
        run: python -m pytest -q tests/test_sentinel_status_contract.py
      - name: Shared Zeek ASCII parser close-time integrity (synthetic only)
        run: python -m pytest -q tests/test_zeek_telemetry.py
      - name: Offline Zeek import, provenance, scoring, SOC and held-out contracts
        run: python -m pytest -q tests/test_zeek_lab_cli.py tests/test_zeek_telemetry_quality.py tests/test_zeek_declared_types.py tests/test_zeek_event_window.py tests/test_offline_pcap_import.py tests/test_offline_pcap_scoring_gate.py tests/test_new_log_timestamp_scoring_gate.py tests/test_offline_pcap_soc_triage_gate.py tests/test_zeek_new_log_inference.py tests/test_zeek_new_log_scoring_partition_gate.py tests/test_zeek_new_log_atomic_output.py tests/test_zeek_new_log_runtime.py tests/test_zeek_research_alert_bundle.py tests/test_zeek_research_queue_soc_e2e.py tests/test_zeek_soc_evidence_link.py tests/test_zeek_soc_case_link_cli.py tests/test_zeek_manual_triage.py tests/test_zeek_strict_input_gates.py tests/test_zeek_originator_split.py tests/test_zeek_port_ablation.py
      - name: Pinned NEW-log manual SOC UI queue binding (synthetic only)
        run: python -m pytest -q tests/test_zeek_new_log_ui_soc.py
      - name: Zeek baseline session variability and private trace compatibility (synthetic only)
        run: python -m pytest -q tests/test_zeek_offline_baseline.py tests/test_zeek_host_variability.py tests/test_zeek_trace_review.py tests/test_zeek_original_capture_chain.py
      - name: Pinned NEW-log ranking diagnostics (synthetic only)
        run: python -m pytest -q tests/test_zeek_ranking_metrics.py tests/test_zeek_new_log_evaluation.py
      - name: TRAIN/VALIDATION Zeek feature-shift preflight (synthetic only)
        run: python -m pytest -q tests/test_zeek_feature_shift.py
      - name: TRAIN/VALIDATION Zeek label-group confounding screen (synthetic only)
        run: python -m pytest -q tests/test_zeek_label_group_screen.py
      - name: Offline Zeek reprocessing normalized flow comparison (synthetic only)
        run: python -m pytest -q tests/test_zeek_reprocessing_compare.py
      - name: Two-pass offline Zeek reproduction (mocked; no Zeek binary)
        run: python -m pytest -q tests/test_two_pass_offline_zeek.py
      - name: Strict classic PCAP record framing (synthetic offline only)
        run: python -m pytest -q tests/test_pcap_structure.py tests/test_offline_pcap_verify.py tests/test_pcap_zeek_tuple.py tests/test_pcap_zeek_distinct_packets.py tests/test_pcap_zeek_timing_offsets.py tests/test_pcap_zeek_signed_offsets.py tests/test_pcap_zeek_offset_percentiles.py tests/test_pcap_ipv4_header_checksum.py
      - name: Offline Windows host-only adapter snapshot checks (mocked; no VMware)
        run: |
          python -m pytest -q tests/test_host_only_preflight.py
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/windows_hostonly_snapshot_smoke.ps1
      - name: Offline Windows guest NIC and route snapshot checks (mocked; no VMware)
        run: |
          python -m pytest -q tests/test_guest_network_preflight.py
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/windows_guest_snapshot_smoke.ps1
      - name: Linux Zeek guest pinned address and main-route snapshot screen (synthetic only)
        run: python -m pytest -q tests/test_linux_guest_network_preflight.py
      - name: Offline paired Windows host and guest configuration checks (synthetic only)
        run: python -m pytest -q tests/test_paired_network_preflight.py
      - name: Integrated private lab evidence chain (synthetic offline only)
        run: python -m pytest -q tests/test_lab_evidence_chain.py tests/test_vmware_session_record.py
      - name: Offline Red Team proposal audit and Streamlit UI
        run: python -m pytest -q tests/test_red_team_planning_audit.py tests/test_red_team_scenario_policy.py tests/test_red_team_audit_verify.py tests/test_red_team_offline_fixture_binding.py tests/test_red_blue_offline_handoff.py tests/test_ci_real_zeek_red_blue_handoff.py
