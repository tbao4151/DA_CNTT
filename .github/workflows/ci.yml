name: Mini-SIEM quality gates
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "app.py"
      - "pages/**"
      - "apps/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: "pip"
          cache-dependency-path: requirements-app.txt
      - name: Assert Python 3.12.9
        run: python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 9)"
      - name: Install
        run: pip install -r requirements-app.txt
      - name: Syntax check
        run: python -m compileall -q app.py src scripts
      - name: Unit tests
        run: pytest -q tests/
