name: Mini-SIEM quality gates
on:
  push:
    paths:
      - "src/**"
      - "scripts/train_siem.py"
      - "app.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-app.txt
      - name: Install
        run: pip install -r requirements-app.txt
      - name: Syntax check
        run: python -m compileall -q app.py src scripts/train_siem.py
      - name: Unit tests
        run: pytest -q tests/
